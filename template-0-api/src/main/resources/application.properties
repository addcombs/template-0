spring.application.name=template-0-api

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Required: the app's own schema in the shared database (scripts\apply-migrations.ps1 creates it).
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA}
spring.jpa.open-in-view=false

# Only the health endpoint is exposed, without component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Declare UTF-8 on every response. Without a charset (e.g. Swagger UI's .js and .css), the Lambda
# adapter decodes the body as ISO-8859-1 and Lambda re-encodes it as UTF-8, corrupting any non-ASCII
# bytes; the corrupted Swagger UI script then fails and the page stays blank.
server.servlet.encoding.force-response=true

# Document only the application API, not Spring Boot's management endpoints.
springdoc.paths-to-match=/api/**

# Required: no default is provided so this application is never silently tied to another project's user pool.
app.cognito.issuer=${COGNITO_ISSUER}
app.cognito.client-id=${COGNITO_CLIENT_ID}

# Optional: comma-separated browser origins allowed to call the API cross-origin, e.g. the deployed UI.
# Empty (the default) allows none; the local UI reaches the API through its dev-server proxy instead.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Optional local overrides from an untracked .env file (KEY=value lines) in the working directory.
spring.config.import=optional:file:.env[.properties]

# The Lambda adapter logs every environment variable (including DATABASE_PASSWORD) at INFO
# on startup; keep it at WARN so secrets never reach the logs.
logging.level.com.amazonaws.serverless.proxy.spring.AwsSpringWebRuntimeInitializer=WARN
